apiVersion: "api.rapyuta.io/v2"
kind: "Database"
metadata:
  name: "orders-db"
  labels:
    app: orders
spec:
  type: postgres
  postgres:
    version: "17"  # Supported: 16, 17, 18
    primary:
      deviceName: edge-node-01
      dataDirectory: /opt/rapyuta/volumes/orders-db
      port: 5432
    # Optional hot-standby topology. Every standby device must be distinct from
    # the primary and from the other standbys. primaryHost is server-resolved
    # from the primary device's IP on primaryInterface — do not set it.
    # standby:
    #   primaryInterface: eth0
    #   # Network the primary trusts for replication in its pg_hba.conf.
    #   # Defaults to 10.0.0.0/8; set it when the fleet is on another network,
    #   # or standbys resolve a valid primaryHost and are then refused by pg_hba.
    #   cidr: 10.0.0.0/8
    #   devices:
    #     - deviceName: edge-node-02
    #       dataDirectory: /opt/rapyuta/volumes/orders-db  # defaults to the primary's
    #       port: 5432
    # The primary user references keys in an Opaque secret (immutable after
    # creation). Create the secret first, e.g.:
    #   rio secret create orders-db-secret --type opaque \
    #     PRIMARY_USER=app PRIMARY_PASS=...
    # The backup and replication users are generated server-side into a managed
    # secret; anything supplied for them is ignored.
    users:
      primary:
        username: {name: orders-db-secret, key: PRIMARY_USER}
        password: {name: orders-db-secret, key: PRIMARY_PASS}
    multipleDatabase:
      - orders
      - analytics
    parameters:
      max_connections: "200"
      shared_buffers: 512MB
