name: Publish release

on:
  push:
    branches:
      - main

concurrency:
  group: publish-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate AppImage upload settings
        shell: bash
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_CLIENT_ID_PUBLISH: ${{ vars.AZURE_CLIENT_ID_PUBLISH }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$AZURE_STORAGE_ACCOUNT" ]]; then
            echo "AZURE_STORAGE_ACCOUNT must be set for release AppImage publishing." >&2
            exit 1
          fi
          if [[ -z "$AZURE_CLIENT_ID_PUBLISH" || -z "$AZURE_TENANT_ID" ]]; then
            echo "vars.AZURE_CLIENT_ID_PUBLISH and vars.AZURE_TENANT_ID must be set for release AppImage publishing." >&2
            exit 1
          fi

      # Fail before the GitHub release is created if the OIDC login is broken.
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PUBLISH }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liFjNsuBdosbyBzO
          private-key: ${{ secrets.BAYMAX_RR_PRIVATE_KEY}}
          owner: ${{ github.repository_owner }}
          repositories: rapyuta-io-actions

      - name: Checkout private actions
        uses: actions/checkout@v7
        with:
          repository: rapyuta-robotics/rapyuta-io-actions
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: .github/rapyuta-io-actions
          persist-credentials: false                   

      - name: Publish GitHub release
        id: publish-release
        uses: ./.github/rapyuta-io-actions/publish-release
        with:
          app_private_key: ${{ secrets.BAYMAX_RR_PRIVATE_KEY }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Build rio AppImage
        shell: bash
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          RELEASE_VERSION: ${{ steps.publish-release.outputs.release_version }}
        run: ./scripts/build-rio-appimage.sh "$RELEASE_VERSION"

      - name: Publish rio AppImage to Azure Blob
        shell: bash
        env:
          CHANNEL: release
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZCOPY_AUTO_LOGIN_TYPE: AZCLI
        run: ./scripts/publish-rio-appimage.sh

      - name: Resolve AppImage asset
        id: appimage
        shell: bash
        run: |
          set -euo pipefail

          appimage_path="$(find scripts -maxdepth 1 -type f -name 'rio*.AppImage' -print -quit)"
          if [[ -z "$appimage_path" ]]; then
            echo "No rio AppImage was produced under scripts/." >&2
            exit 1
          fi

          appimage_file="$(basename "$appimage_path")"

          {
            echo "appimage_path=${appimage_path}"
            echo "appimage_file=${appimage_file}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token for asset upload
        id: app-token-upload
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liFjNsuBdosbyBzO
          private-key: ${{ secrets.BAYMAX_RR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Attach AppImage to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token-upload.outputs.token }}
          RELEASE_TAG: ${{ steps.publish-release.outputs.release_tag }}
          APPIMAGE_PATH: ${{ steps.appimage.outputs.appimage_path }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$APPIMAGE_PATH" --clobber
