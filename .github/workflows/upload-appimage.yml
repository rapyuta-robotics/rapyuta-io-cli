name: ⬆️ Upload AppImage
on:
  push:
    branches:
    - devel
  pull_request:

jobs:
  upload-appimage:
    runs-on: aks-spot-4cpu
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Resolve build metadata
        id: meta
        run: |
          echo "channel=${{ github.event_name == 'pull_request' && 'dev' || 'devel' }}" >> "$GITHUB_OUTPUT"
          # scripts/branch-slug.sh is the single source of truth for the slug;
          # the upload path and the PR comment below both read it from here.
          echo "slug=$(./scripts/branch-slug.sh)" >> "$GITHUB_OUTPUT"

      - name: Stamp channel into version
        run: ./scripts/stamp-channel-version.sh
        shell: bash
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}

      - name: Create AppImage
        run: ./scripts/build-rio-appimage.sh
        shell: bash
        env:
          MINIO_URL: ${{ secrets.MINIO_URL }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET: ${{ secrets.MINIO_SECRET }}

      - name: Publish AppImage to Azure Blob
        run: ./scripts/publish-rio-appimage.sh
        shell: bash
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_SAS_TOKEN: ${{ secrets.AZURE_SAS_TOKEN }}

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install gh

      - name: Comment blob link on PR
        if: github.event_name == 'pull_request'
        run: |
          if [ -z "$ACCOUNT" ]; then
            echo "No Azure account secret (fork PR?) — skipping blob comment"
            exit 0
          fi
          FILE=$(ls scripts/rio*.AppImage | xargs -n1 basename | head -n1)
          URL="https://${ACCOUNT}.blob.core.windows.net/dev/${SLUG}/${FILE}"
          gh pr comment "$PR_NUMBER" --edit-last -b "**🤖 PR AppImage:** [$FILE]($URL)" \
            || gh pr comment "$PR_NUMBER" -b "**🤖 PR AppImage:** [$FILE]($URL)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          SLUG: ${{ steps.meta.outputs.slug }}
